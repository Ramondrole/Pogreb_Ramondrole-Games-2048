<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="header">
            <div class="ramondrole">RAMONDR<span style="color:#0ff;">◈</span>LE</div>
            <div class="score-panel">
                <span class="score-label">SCR</span>
                <span id="scoreValue">0</span>
            </div>
        </div>

        
        <div class="grid-container" id="grid"></div>

        
        <div class="button-panel">
            <button class="cyber-button" id="newGameBtn">⟲ NEW GAME</button>
            <a href="https://ramondrole.github.io/Pogreb_Ramondrole-Games/" class="cyber-button back-button">← НАЗАД</a>
        </div>

        <div class="message" id="gameMessage"></div>
        <div class="footer-note">←  ↑  →  ↓   |   swipe</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
