<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ramondrole - 2048</title>
    <link rel="icon" href="./Ramondrole.webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="game2048.css">
</head>
<body>
    <nav>
        <div class="logo">RAMONDROLE</div>
        <div class="nav-links">
            <a href="https://ramondrole.github.io/Pogreb_Ramondrole-About_me/" data-key="about">Обо мне</a>
            <a href="https://ramondrole.github.io/Pogreb_Ramondrole-Games/" data-key="games">Наши игры</a>
            <a href="https://ramondrole.github.io/Pogreb_Ramondrole-Userful_functions/" data-key="functions">Полезные функции</a>
        </div>
        <div class="language-switcher">
            <button class="lang-btn" id="langBtn">🌐 RU</button>
            <ul class="lang-dropdown">
                <li><a href="#" data-lang="ru">🇷🇺 Русский</a></li>
                <li><a href="#" data-lang="en">🇺🇸 English</a></li>
                <li><a href="#" data-lang="de">🇩🇪 Deutsch</a></li>
            </ul>
        </div>
    </nav>

    <div class="game2048-wrapper">
        <div class="header">
            <div class="ramondrole">RAMONDR<span style="color:#0ff;">◈</span>LE</div>
            <div class="score-panel">
                <span class="score-label" id="scoreLabel">SCR</span>
                <span id="scoreValue">0</span>
            </div>
        </div>

        <div class="grid-container" id="grid"></div>

        <div class="button-panel">
            <button class="cyber-button" id="newGameBtn" data-key="newGameBtn">⟲ NEW GAME</button>
        </div>

        <div class="message" id="gameMessage"></div>
        <div class="footer-note" id="footerNote">←  ↑  →  ↓   |   swipe</div>
    </div>

    <script src="game2048.js"></script>
</body>
</html>
